<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cars Fanbase</title>
    <style>
        /* --- GLOBAL STYLES --- */
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; text-align: center; padding: 20px; margin: 0; }
        h1 { color: #d32f2f; margin-bottom: 5px;}
        p.subtitle { color: #555; margin-top: 0; margin-bottom: 30px; }

        /* --- HOME PAGE VIEW STYLES --- */
        .grid { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; }
        .card { 
            background: white; border-radius: 10px; padding: 15px; width: 250px; 
            box-shadow: 0 4px 8px rgba(0,0,0,0.1); transition: transform 0.2s, box-shadow 0.2s;
            cursor: pointer; 
        }
        .card:hover { transform: scale(1.05); box-shadow: 0 8px 16px rgba(0,0,0,0.2); }
        .card img { width: 100%; height: 150px; object-fit: cover; border-radius: 5px; }
        .card h3 { color: #333; margin: 15px 0 5px; }
        .car-model-sm { font-size: 12px; font-weight: bold; color: #d32f2f; margin-bottom: 10px; }
        
        /* --- CHARACTER DETAIL VIEW STYLES --- */
        #character-detail-view {
            display: none; /* Hidden by default */
            max-width: 800px;
            margin: 0 auto;
            text-align: left;
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }

        /* The image is now very large */
        .large-character-img {
            width: 100%;
            height: auto;
            max-height: 500px;
            object-fit: contain; /* Ensures the full car is seen without cropping */
            border-radius: 10px;
            margin-bottom: 20px;
            background-color: #eee; /* Light background for transparent images */
        }

        .detail-name { font-size: 36px; color: #333; margin: 0; }
        .detail-model { font-size: 18px; font-weight: bold; color: #d32f2f; margin-bottom: 20px; }
        .detail-quote { font-style: italic; color: #555; margin-bottom: 25px; font-size: 22px; text-align: center; line-height: 1.4; border-left: 5px solid #d32f2f; padding-left: 15px;}
        .detail-desc { line-height: 1.8; color: #333; font-size: 16px; margin-bottom: 30px; }
        .detail-actor { font-size: 14px; color: #888; border-top: 1px solid #eee; padding-top: 15px; font-weight: bold;}

        /* Back Button Style */
        .back-btn {
            background-color: #d32f2f;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-bottom: 30px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .back-btn:hover { background-color: #b71c1c; }

    </style>
</head>
<body>

    <div id="homepage-view">
        <h1>Welcome to Radiator Springs!</h1>
        <p class="subtitle">Click on any character to learn more about them.</p>

        <div class="grid" id="character-container">
            <p>Loading characters...</p>
        </div>
    </div>

    <div id="character-detail-view">
        <button class="back-btn" onclick="showHomePage()">
            &larr; Back to Main Road
        </button>

        <div class="detail-content">
            <img id="detailImg" class="large-character-img" src="" alt="">
            
            <h2 id="detailName" class="detail-name"></h2>
            <div id="detailModel" class="car-model-sm detail-model"></div>
            
            <p id="detailQuote" class="detail-quote"></p>
            
            <p id="detailDesc" class="detail-desc"></p>
            
            <div id="detailActor" class="detail-actor"></div>
        </div>
    </div>

    <script>
        const API_URL = "/characters/";
        let allCharacters = []; // Store fetched data locally

        // 1. Fetch data from API on load
        async function fetchCharacters() {
            try {
                const response = await fetch(API_URL);
                if (!response.ok) throw new Error("API Network error");
                allCharacters = await response.json();
                displayCharacters(allCharacters);
            } catch (error) {
                console.error("Error:", error);
                document.getElementById('character-container').innerHTML = "<p style='color:red;'>Error loading characters. Verify your API.</p>";
            }
        }

        // 2. Display the Grid on Homepage
        function displayCharacters(characters) {
            const container = document.getElementById('character-container');
            container.innerHTML = ""; 
            
            characters.forEach((character, index) => {
                // Reuse the same image path logic
                const imageName = character.name.toLowerCase().replace(/ /g, '_');
                const card = document.createElement('div');
                card.className = 'card';
                
                // When clicked, switch to detail view
                card.onclick = () => showCharacterDetail(index, imageName);
                
                card.innerHTML = `
                    <img src="images/${imageName}.jpg" onerror="this.src='https://via.placeholder.com/250x150?text=No+Image'">
                    <h3>${character.name}</h3>
                    <div class="car-model-sm">${character.car_model}</div>
                `;
                container.appendChild(card);
            });
        }

        // 3. Logic to show the LARGE Character Detail View
        function showCharacterDetail(index, imageName) {
            const char = allCharacters[index]; // Get cached data
            
            // Populate the detailed view elements
            document.getElementById('detailImg').src = `images/${imageName}.jpg`;
            document.getElementById('detailImg').alt = char.name;
            document.getElementById('detailName').innerText = char.name;
            document.getElementById('detailModel').innerText = char.car_model;
            document.getElementById('detailQuote').innerText = `"${char.quote}"`;
            document.getElementById('detailDesc').innerText = char.description;
            document.getElementById('detailActor').innerText = `Voiced by: ${char.actor ? char.actor.name : 'Unknown'}`;
            
            // HIDE the homepage grid
            document.getElementById('homepage-view').style.display = "none";
            // SHOW the character detail view
            document.getElementById('character-detail-view').style.display = "block";
            
            // Scroll to the top of the page so they see the image immediately
            window.scrollTo(0, 0);
        }

        // 4. Logic for the "Back" button
        function showHomePage() {
            // HIDE the detail view
            document.getElementById('character-detail-view').style.display = "none";
            // SHOW the homepage grid again
            document.getElementById('homepage-view').style.display = "block";
        }

        // Run on page load
        fetchCharacters();
    </script>
</body>
</html>
