<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cars Fanbase</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            background-color: #f4f4f9; 
            text-align: center; 
            padding: 20px; 
            margin: 0;
        }
        h1 {
            color: #d32f2f;
        }
        .grid { 
            display: flex; 
            flex-wrap: wrap; 
            justify-content: center; 
            gap: 20px; 
            margin-top: 30px; 
        }
        .card { 
            background: white; 
            border-radius: 10px; 
            padding: 15px; 
            width: 250px; 
            box-shadow: 0 4px 8px rgba(0,0,0,0.1); 
            transition: transform 0.2s;
        }
        .card:hover {
            transform: scale(1.05);
        }
        .card img { 
            width: 100%; 
            height: 150px; 
            object-fit: cover; 
            border-radius: 5px; 
        }
        .card h3 { 
            color: #333; 
            margin: 15px 0 5px; 
        }
        .car-model { 
            font-size: 12px; 
            font-weight: bold; 
            color: #d32f2f; 
            margin-bottom: 10px; 
        }
        .quote { 
            font-size: 14px; 
            color: #555; 
            font-style: italic; 
        }
        .actor { 
            font-size: 12px; 
            color: #888; 
            margin-top: 15px; 
            border-top: 1px solid #eee; 
            padding-top: 10px; 
        }
        .error {
            color: red;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h1>Welcome to Radiator Springs!</h1>
    <p>All character data is being fetched live from your FastAPI backend.</p>

    <div class="grid" id="character-container">
        <p>Loading characters...</p>
    </div>

    <script>
        // Because FastAPI serves this file, it can just look for the endpoint directly on the same server!
        const API_URL = "/characters/";

        async function fetchCharacters() {
            try {
                const response = await fetch(API_URL);
                if (!response.ok) {
                    throw new Error("Failed to fetch data");
                }
                const characters = await response.json();
                displayCharacters(characters);
            } catch (error) {
                console.error("Error fetching data:", error);
                document.getElementById('character-container').innerHTML = 
                    "<p class='error'>Error loading characters. Make sure your FastAPI server is running!</p>";
            }
        }

        function displayCharacters(characters) {
            const container = document.getElementById('character-container');
            container.innerHTML = ""; // Clear the "Loading..." text
            
            characters.forEach(character => {
                // Automatically formats names like "Lightning McQueen" into "lightning_mcqueen"
                const imageName = character.name.toLowerCase().replace(/ /g, '_');
                
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <img src="images/${imageName}.jpg" alt="${character.name}" onerror="this.src='https://via.placeholder.com/250x150?text=No+Image'">
                    <h3>${character.name}</h3>
                    <div class="car-model">${character.car_model}</div>
                    <p class="quote">"${character.quote}"</p>
                    <div class="actor">Voiced by: ${character.actor ? character.actor.name : 'Unknown'}</div>
                `;
                container.appendChild(card);
            });
        }

        // Run the fetch function as soon as the page loads
        fetchCharacters();
    </script>
</body>
</html>
